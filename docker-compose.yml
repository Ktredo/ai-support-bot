services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  bot:
    build: .
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      # Внутри compose-сети Ollama доступна по имени сервиса,
      # а не по 127.0.0.1 (это был бы сам контейнер с ботом).
      OLLAMA_URL: http://ollama:11434/api/generate
      LOCAL_OLLAMA_URL: http://ollama:11434/api/generate
    ports:
      - "8000:8000"
    volumes:
      # Код читает только knowledge_base.txt; каталог pdfs/ и knowledge_base/
      # пайплайном не используются, поэтому и монтировать их незачем.
      - ./knowledge_base.txt:/app/knowledge_base.txt:ro
      - ./qdrant_db:/app/qdrant_db

volumes:
  ollama_data:
